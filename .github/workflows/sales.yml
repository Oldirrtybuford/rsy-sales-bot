name: RSY sales bot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum; runs can be delayed)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print posts only, do not post to X or save state)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rsy-sales-bot
  cancel-in-progress: false

jobs:
  check-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          ref: main   # always start from the newest state, not the commit the run was queued on

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check Magic Eden and post new sales
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python bot.py

      - name: Save state.json back to the repo
        # Runs even if a post failed, so retry counters are kept. Skipped in dry runs.
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json unchanged; nothing to commit"
            exit 0
          fi
          cp state.json /tmp/my_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python merge_state.py /tmp/my_state.json state.json
            if git diff --quiet -- state.json; then
              echo "repo already up to date"
              exit 0
            fi
            git add state.json
            git commit -m "Update sales state [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not push state.json" && exit 1
